name: Live API smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'devpulse/**'
      - 'scripts/live_smoke.py'
      - '.github/workflows/live-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'devpulse/**'
      - 'scripts/live_smoke.py'
      - '.github/workflows/live-smoke.yml'
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.live_smoke
