name: Container smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build -t devpulse:ci .
      - name: Verify isolated non-root container
        shell: bash
        run: |
          set -eu
          docker run -d --name devpulse-ci --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=256m --pids-limit=64 -p 127.0.0.1:18000:8000 devpulse:ci
          trap 'docker logs devpulse-ci; docker rm -f devpulse-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health > /tmp/devpulse-health.json; then break; fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/devpulse-health.json")) == {"status":"ok"}'
          test "$(docker exec devpulse-ci id -u)" = 10001
          curl -fsS http://127.0.0.1:18000/ | grep -q 'DevPulse'
          curl -fsS http://127.0.0.1:18000/assets/dashboard.js | grep -q 'renderRecommendations'
          curl -fsS http://127.0.0.1:18000/assets/dashboard.css > /tmp/devpulse-style.css
          test -s /tmp/devpulse-style.css
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18000/api/scan?repo=invalid')" = 400
          echo 'Container health, non-root UID, assets and input rejection verified.'
